name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish the costly report; keep only the newest pending commit in this group.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gremlins:
    name: Mutation shard (${{ matrix.operator }}, ${{ matrix.index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balance complete modules by observed per-operator mutant runtime.
          # Boolean has the most work; comparison was a single multi-hour job.
          - {operator: comparison, index: 0, count: 4}
          - {operator: comparison, index: 1, count: 4}
          - {operator: comparison, index: 2, count: 4}
          - {operator: comparison, index: 3, count: 4}
          - {operator: arithmetic, index: 0, count: 2}
          - {operator: arithmetic, index: 1, count: 2}
          - {operator: boolean, index: 0, count: 8}
          - {operator: boolean, index: 1, count: 8}
          - {operator: boolean, index: 2, count: 8}
          - {operator: boolean, index: 3, count: 8}
          - {operator: boolean, index: 4, count: 8}
          - {operator: boolean, index: 5, count: 8}
          - {operator: boolean, index: 6, count: 8}
          - {operator: boolean, index: 7, count: 8}
          - {operator: boundary, index: 0, count: 2}
          - {operator: boundary, index: 1, count: 2}
          - {operator: return, index: 0, count: 4}
          - {operator: return, index: 1, count: 4}
          - {operator: return, index: 2, count: 4}
          - {operator: return, index: 3, count: 4}
    env:
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GREMLIN_OPERATORS: ${{ matrix.operator }}
      GREMLIN_CACHE: "1"
      SHARD_INDEX: ${{ matrix.index }}
      SHARD_COUNT: ${{ matrix.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # Reuse results only when the complete code and test inputs match. The
      # plugin also hashes each target and its covering tests internally.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .gremlins_cache
          key: gremlins-${{ runner.os }}-py313-${{ matrix.operator }}-${{ matrix.index }}of${{ matrix.count }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'Makefile', 'src/**', 'tests/**', 'plugins/**', 'scripts/mutation_shards.py', 'scripts/mutation_weights.json', '.github/workflows/mutation.yml') }}

      - run: uv sync --all-groups --locked

      - name: Mutate this operator's module partition
        run: |
          set -euo pipefail
          MUTATION_RUN_TARGETS="$(python3 scripts/mutation_shards.py --operator "$GREMLIN_OPERATORS" --index "$SHARD_INDEX" --count "$SHARD_COUNT")"
          export MUTATION_RUN_TARGETS
          make mutate
          test -s coverage/gremlins/gremlins.json

      - name: Upload report
        if: always() && hashFiles('coverage/gremlins/gremlins.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gremlins-report-${{ matrix.operator }}-${{ matrix.index }}
          path: coverage/gremlins/

  mutation-threshold:
    name: Mutation Testing (pytest-gremlins)
    if: always()
    needs: gremlins
    runs-on: ubuntu-latest
    steps:
      # A missing shard would silently shrink each module's denominator.
      - name: Require every mutation shard
        env:
          SHARDS: ${{ needs.gremlins.result }}
        run: test "$SHARDS" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "gremlins-report-*"
          path: coverage/shards

      # Report-only until v0.1.0 ships: the per-module rate is printed but does not fail CI.
      - name: Report the per-module kill rate
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -d '' reports < <(find coverage/shards -name gremlins.json -print0)
          python3 scripts/mutation_threshold.py "${reports[@]}" --min 90
